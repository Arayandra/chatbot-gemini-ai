<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Gemini AI Chatbot interface preview</title>
<desc id="desc">Preview of the chatbot page showing a conversation about a three-day Bali itinerary, message bubbles, and the text input.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f5fb"/><stop offset="1" stop-color="#edf1f7"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3277f4"/><stop offset="1" stop-color="#245bd6"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#16233d" flood-opacity=".14"/></filter>
</defs>
<rect width="1440" height="1040" fill="url(#bg)"/>
<circle cx="180" cy="160" r="130" fill="#dce8fb" opacity=".38"/><circle cx="1270" cy="850" r="200" fill="#dce8fb" opacity=".34"/>
<rect x="330" y="48" width="780" height="944" rx="26" fill="#fff" stroke="#e2e6ed" filter="url(#shadow)"/>
<path d="M356 48h728a26 26 0 0 1 26 26v73H330V74a26 26 0 0 1 26-26Z" fill="#fff"/>
<circle cx="382" cy="99" r="19" fill="#eaf1ff"/><path d="M382 85c8 8 8 20 0 28-8-8-8-20 0-28Z" fill="#3271e7"/><path d="M370 99h24" stroke="#3271e7" stroke-width="2.3" stroke-linecap="round"/>
<text x="414" y="96" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#242a35">Gemini AI Chatbot</text>
<text x="414" y="119" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#8993a3">Travel assistant · Powered by Gemini</text>
<circle cx="1052" cy="99" r="5" fill="#22c55e"/><text x="1066" y="104" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6e7887">Online</text>
<path d="M330 147h780" stroke="#eceff3"/>
<text x="720" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a1a9b5">TODAY · TRAVEL PLANNING</text>
<rect x="570" y="220" width="500" height="72" rx="18" fill="url(#blue)"/><path d="M1048 278h22l-16 14Z" fill="#245bd6"/>
<text x="596" y="251" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#fff">Saya ingin liburan ke Bali selama 3 hari.</text>
<text x="596" y="274" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#fff">Bisa bantu buatkan itinerary?</text>
<rect x="370" y="318" width="660" height="495" rx="18" fill="#f1f3f6"/><path d="M386 797h-22l16 16Z" fill="#f1f3f6"/>
<circle cx="398" cy="348" r="12" fill="#dce7fb"/><path d="M398 339c5 5 5 13 0 18-5-5-5-13 0-18Z" fill="#3271e7"/>
<text x="420" y="353" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#3d4757">Gemini AI</text>
<text x="392" y="390" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#293241">Tentu! Senang membantu merencanakan liburan Anda.</text>
<text x="392" y="421" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#454e5b">Berikut contoh itinerary 3 hari di Bali:</text>
<text x="392" y="461" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#293241">Hari 1 — Ubud</text>
<text x="406" y="488" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4d5663">• Kunjungi Tegallalang Rice Terrace</text>
<text x="406" y="513" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4d5663">• Jelajahi pusat seni dan budaya Ubud</text>
<text x="406" y="538" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4d5663">• Coba kuliner khas Bali</text>
<text x="392" y="580" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#293241">Hari 2 — Pantai Selatan</text>
<text x="406" y="607" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4d5663">• Bersantai di Pantai Pandawa</text>
<text x="406" y="632" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4d5663">• Mengunjungi Pura Uluwatu</text>
<text x="406" y="657" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4d5663">• Menikmati matahari terbenam</text>
<text x="392" y="699" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#293241">Hari 3 — Wisata Santai</text>
<text x="406" y="726" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4d5663">• Sarapan lokal dan berburu oleh-oleh</text>
<text x="406" y="751" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4d5663">• Persiapan kembali ke bandara</text>
<text x="392" y="786" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#687385">Ingin itinerary yang lebih santai atau lebih banyak aktivitas?</text>
<rect x="610" y="838" width="460" height="56" rx="17" fill="url(#blue)"/><path d="M1048 879h22l-16 15Z" fill="#245bd6"/>
<text x="636" y="872" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#fff">Saya lebih suka pantai dan kuliner lokal.</text>
<path d="M330 916h780" stroke="#eceff3"/>
<rect x="360" y="937" width="595" height="42" rx="22" fill="#fafafa" stroke="#dfe3e9"/><text x="382" y="964" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#9aa2ae">Type your message...</text>
<rect x="969" y="937" width="110" height="42" rx="22" fill="#2563eb"/><text x="1024" y="963" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#fff">Send</text>
</svg>